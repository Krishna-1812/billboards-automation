<!doctype html>
<html lang="{{ plang }}" dir="{{ 'rtl' if plang == 'ar' else 'ltr' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#F2EFE8">
  <meta name="description" content="{{ tw('hero_sub', company=company) }}">
  <title>{% block title %}{{ company }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='motion.css') }}?v=2">
  <link rel="stylesheet" href="{{ url_for('static', filename='public.css') }}?v=6">
  <script>try { if (!sessionStorage.getItem('intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('m-intro-on'); } catch (e) {}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%2311110F'/%3E%3Crect x='11' y='11' width='8' height='8' fill='%23F2EFE8'/%3E%3Crect x='21' y='11' width='8' height='8' fill='%23F2EFE8'/%3E%3Crect x='11' y='21' width='8' height='8' fill='%23F2EFE8'/%3E%3Crect x='21' y='21' width='8' height='8' fill='%23FF4F1A'/%3E%3C/svg%3E">
</head>
<body class="quiet">
<a class="skip" href="#main">{{ tw('skip') }}</a>
{% block body %}{% endblock %}
<script>window.CSRF = document.querySelector('meta[name=csrf-token]').content;</script>
<script src="{{ url_for('static', filename='motion.js') }}?v=2"></script>
<script src="{{ url_for('static', filename='public.js') }}?v=3"></script>
{% block scripts %}{% endblock %}
</body>
</html>
